version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: sadaka_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sadaka
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Схему создаёт бэкенд (GORM AutoMigrate), database/schema.sql устарел.
    networks:
      - sadaka_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sadaka_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - sadaka_network
    command: redis-server --appendonly yes

  # Backend API (Go)
  backend:
    build: ./backend
    container_name: sadaka_backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/sadaka?sslmode=disable
      PORT: 8080
      ENV: development
      PAYMENT_PROVIDER: mock
      CORS_ORIGINS: "*"
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sadaka_network

  # Website (Next.js): публичный сайт, кабинет мечети и панель Комитета (/admin)
  website:
    image: node:20-alpine
    container_name: sadaka_website
    working_dir: /app
    volumes:
      - ./website:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8080/api/v1
    command: sh -c "npm install && npm run dev"
    networks:
      - sadaka_network

  # Nginx (Reverse Proxy)
  nginx:
    image: nginx:alpine
    container_name: sadaka_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - website
    networks:
      - sadaka_network

volumes:
  postgres_data:
  redis_data:

networks:
  sadaka_network:
    driver: bridge
